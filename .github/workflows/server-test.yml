name: server-test

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server-test.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/server-test.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: daon_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_DATABASE: daon_test
