<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="784" viewBox="0 0 1120 784" role="img" aria-labelledby="title desc" font-family="Segoe UI, Malgun Gothic, Arial, sans-serif"><title id="title">다온 · 모델 학습과 앱 서빙</title><desc id="desc">회귀와 분류는 별도로 학습합니다. 앱 서빙 경로와도 구분해서 봅니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#BA5065" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1120" height="784" rx="24" fill="#FAFBFC" stroke="#E2E7EC"/><rect x="0" y="0" width="1120" height="152" rx="24" fill="#182432" stroke="none"/><rect x="0" y="116" width="1120" height="36" rx="0" fill="#182432" stroke="none"/><text x="40" y="38" font-size="13" fill="#A8BCCB" font-weight="650">SYSTEM OVERVIEW</text><text x="40" y="85" font-size="34" fill="#FFFFFF" font-weight="650">다온 · 모델 학습과 앱 서빙</text><text x="40" y="122" font-size="17" fill="#CFD9E2" font-weight="400">회귀와 분류는 별도로 학습합니다. 앱 서빙 경로와도 구분해서 봅니다.</text><text x="40" y="184" font-size="16" fill="#BA5065" font-weight="650">회귀 실험</text><rect x="40" y="202" width="328" height="120" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="60" y="236" font-size="22" fill="#202B38" font-weight="650">대화 · 하드 라벨</text><text x="60" y="266" font-size="16" fill="#657180" font-weight="400">0 / 0.5 / 1</text><path d="M373 262 L390 262" fill="none" stroke="#BA5065" stroke-width="2"  marker-end="url(#arrow)"/><rect x="396" y="202" width="328" height="120" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="416" y="236" font-size="22" fill="#202B38" font-weight="650">Soft Labeling</text><text x="416" y="266" font-size="16" fill="#657180" font-weight="400">Snorkel · 그래프 라벨 전파</text><path d="M729 262 L746 262" fill="none" stroke="#BA5065" stroke-width="2"  marker-end="url(#arrow)"/><rect x="752" y="202" width="328" height="120" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="772" y="236" font-size="22" fill="#202B38" font-weight="650">BiERU 회귀</text><text x="772" y="266" font-size="16" fill="#657180" font-weight="400">KoBigBird · GNTB · LSTM/CNN</text><text x="40" y="364" font-size="16" fill="#BA5065" font-weight="650">분류 실험</text><rect x="40" y="382" width="328" height="120" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="60" y="416" font-size="22" fill="#202B38" font-weight="650">대화 · 하드 라벨</text><text x="60" y="446" font-size="16" fill="#657180" font-weight="400">상승 여부로 이진화</text><path d="M373 442 L390 442" fill="none" stroke="#BA5065" stroke-width="2"  marker-end="url(#arrow)"/><rect x="396" y="382" width="328" height="120" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="416" y="416" font-size="22" fill="#202B38" font-weight="650">KoBigBird</text><text x="416" y="446" font-size="16" fill="#657180" font-weight="400">현재 발화 + 대화 기록</text><path d="M729 442 L746 442" fill="none" stroke="#BA5065" stroke-width="2"  marker-end="url(#arrow)"/><rect x="752" y="382" width="328" height="120" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="772" y="416" font-size="22" fill="#202B38" font-weight="650">이진 분류</text><text x="772" y="446" font-size="16" fill="#657180" font-weight="400">호감 상승 여부 학습</text><text x="40" y="544" font-size="16" fill="#BA5065" font-weight="650">앱 서빙 · 별도 아티팩트</text><rect x="40" y="562" width="328" height="120" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="60" y="596" font-size="22" fill="#202B38" font-weight="650">W&amp;B Artifacts</text><text x="60" y="626" font-size="16" fill="#657180" font-weight="400">남성 · 여성 모델</text><path d="M373 622 L390 622" fill="none" stroke="#BA5065" stroke-width="2"  marker-end="url(#arrow)"/><rect x="396" y="562" width="328" height="120" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="416" y="596" font-size="22" fill="#202B38" font-weight="650">Flask /analyze</text><text x="416" y="626" font-size="16" fill="#657180" font-weight="400">Hugging Face 분류 모델 로드</text><path d="M729 622 L746 622" fill="none" stroke="#BA5065" stroke-width="2"  marker-end="url(#arrow)"/><rect x="752" y="562" width="328" height="120" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="772" y="596" font-size="22" fill="#202B38" font-weight="650">Node → 앱</text><text x="772" y="626" font-size="16" fill="#657180" font-weight="400">호감 점수 반환</text><text x="40" y="761" font-size="13" fill="#657180" font-weight="400">서빙 아티팩트를 만든 학습 코드는 학습 저장소에 없습니다. 위 실험과 직접 연결하지 않습니다.</text></svg>