<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="890" viewBox="0 0 1120 890" role="img" aria-labelledby="title desc" font-family="Segoe UI, Malgun Gothic, Arial, sans-serif"><title id="title">다온 · 대화가 관계로 이어지는 구조</title><desc id="desc">영상 연결, 서비스 데이터, 통화 후 분석을 서로 다른 경로로 읽습니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#BA5065" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1120" height="890" rx="24" fill="#FAFBFC" stroke="#E2E7EC"/><rect x="0" y="0" width="1120" height="152" rx="24" fill="#182432" stroke="none"/><rect x="0" y="116" width="1120" height="36" rx="0" fill="#182432" stroke="none"/><text x="40" y="38" font-size="13" fill="#A8BCCB" font-weight="650">SYSTEM OVERVIEW</text><text x="40" y="85" font-size="34" fill="#FFFFFF" font-weight="650">다온 · 대화가 관계로 이어지는 구조</text><text x="40" y="122" font-size="17" fill="#CFD9E2" font-weight="400">영상 연결, 서비스 데이터, 통화 후 분석을 서로 다른 경로로 읽습니다.</text><text x="40" y="186" font-size="16" fill="#BA5065" font-weight="650">01  실시간 연결</text><rect x="40" y="206" width="300" height="132" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="60" y="233" font-size="12" fill="#BA5065" font-weight="650">DEVICE</text><text x="60" y="263" font-size="22" fill="#202B38" font-weight="650">Flutter 앱 A</text><text x="60" y="290" font-size="16" fill="#657180" font-weight="400">카메라 · 마이크</text><text x="60" y="315" font-size="16" fill="#657180" font-weight="400">ML Kit 얼굴 마스킹</text><rect x="410" y="206" width="300" height="132" rx="14" fill="#FCEEF1" stroke="#BA5065"/><text x="430" y="233" font-size="12" fill="#BA5065" font-weight="650">SIGNALING</text><text x="430" y="263" font-size="22" fill="#202B38" font-weight="650">Socket.IO</text><text x="430" y="290" font-size="16" fill="#657180" font-weight="400">offer · answer · ICE 중계</text><text x="430" y="315" font-size="16" fill="#657180" font-weight="400">회원 확인 · 통화 상태</text><rect x="780" y="206" width="300" height="132" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="800" y="233" font-size="12" fill="#BA5065" font-weight="650">DEVICE</text><text x="800" y="263" font-size="22" fill="#202B38" font-weight="650">Flutter 앱 B</text><text x="800" y="290" font-size="16" fill="#657180" font-weight="400">카메라 · 마이크</text><text x="800" y="315" font-size="16" fill="#657180" font-weight="400">상대 영상 표시</text><path d="M346 265 L402 265" fill="none" stroke="#BA5065" stroke-width="2"  marker-end="url(#arrow)"/><path d="M716 265 L772 265" fill="none" stroke="#BA5065" stroke-width="2"  marker-end="url(#arrow)"/><path d="M190 341 V370 H930 V341" fill="none" stroke="#BA5065" stroke-width="2" marker-end="url(#arrow)"/><rect x="372" y="353" width="376" height="32" rx="16" fill="#FAFBFC" stroke="none"/><text x="392" y="375" font-size="16" fill="#BA5065" font-weight="600">WebRTC · 영상과 음성은 앱 사이 P2P</text><text x="40" y="418" font-size="16" fill="#BA5065" font-weight="650">02  서비스와 저장</text><rect x="40" y="438" width="300" height="126" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="60" y="472" font-size="22" fill="#202B38" font-weight="650">앱의 서비스 요청</text><text x="60" y="502" font-size="16" fill="#657180" font-weight="400">회원 · 매칭 · 채팅</text><text x="60" y="527" font-size="16" fill="#657180" font-weight="400">관계 단계 · 장소 조회</text><rect x="410" y="438" width="300" height="126" rx="14" fill="#FCEEF1" stroke="#BA5065"/><text x="430" y="472" font-size="22" fill="#202B38" font-weight="650">Express API</text><text x="430" y="502" font-size="16" fill="#657180" font-weight="400">JWT 인증 · 접근 권한 검사</text><text x="430" y="527" font-size="16" fill="#657180" font-weight="400">외부 API 호출 중계</text><rect x="780" y="438" width="300" height="126" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="800" y="472" font-size="22" fill="#202B38" font-weight="650">MySQL / TourAPI</text><text x="800" y="502" font-size="16" fill="#657180" font-weight="400">MySQL: 회원 · 관계 · 채팅</text><text x="800" y="527" font-size="16" fill="#657180" font-weight="400">TourAPI: 데이트 장소</text><path d="M346 501 L402 501" fill="none" stroke="#BA5065" stroke-width="2"  marker-end="url(#arrow)"/><path d="M716 501 L772 501" fill="none" stroke="#BA5065" stroke-width="2"  marker-end="url(#arrow)"/><text x="40" y="606" font-size="16" fill="#BA5065" font-weight="650">03  통화 후 분석</text><rect x="40" y="626" width="300" height="126" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="60" y="660" font-size="22" fill="#202B38" font-weight="650">통화 녹음 · 대화문</text><text x="60" y="690" font-size="16" fill="#657180" font-weight="400">AAC → /api/stt</text><text x="60" y="715" font-size="16" fill="#657180" font-weight="400">CLOVA Speech로 문자 변환</text><rect x="410" y="626" width="300" height="126" rx="14" fill="#FCEEF1" stroke="#BA5065"/><text x="430" y="660" font-size="22" fill="#202B38" font-weight="650">Node 서버를 거쳐 분석</text><text x="430" y="690" font-size="16" fill="#657180" font-weight="400">/api/analysis → OpenAI</text><text x="430" y="715" font-size="16" fill="#657180" font-weight="400">/api/predict → Flask 모델</text><rect x="780" y="626" width="300" height="126" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="800" y="660" font-size="22" fill="#202B38" font-weight="650">결과는 기기에 저장</text><text x="800" y="690" font-size="16" fill="#657180" font-weight="400">대화 분석: JSON 파일</text><text x="800" y="715" font-size="16" fill="#657180" font-weight="400">호감 점수: SharedPreferences</text><path d="M346 689 L402 689" fill="none" stroke="#BA5065" stroke-width="2"  marker-end="url(#arrow)"/><path d="M716 689 L772 689" fill="none" stroke="#BA5065" stroke-width="2"  marker-end="url(#arrow)"/><rect x="40" y="780" width="1040" height="64" rx="12" fill="#FCEEF1" stroke="none"/><text x="60" y="806" font-size="17" fill="#BA5065" font-weight="650">외부 API 키는 서버에 · 얼굴 마스킹은 기기에</text><text x="60" y="829" font-size="15" fill="#657180" font-weight="400">Flask는 내부 주소에서 모델을 서빙합니다. 통화 연결과 분석 요청의 경로를 분리했습니다.</text><text x="40" y="867" font-size="13" fill="#657180" font-weight="400">SOURCE  server/server.js · server/model_server.py · lib/services/</text></svg>