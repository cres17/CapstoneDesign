l="#173E58">Flask · Transformers · PyTorch</text><text x="790" y="500" font-size="16" fill="#53616C">관점별 KoBigBird 추론</text><text x="790" y="526" font-size="16" fill="#53616C">512토큰 · sigmoid 점수</text></g><g><rect x="774" y="578" width="304" height="128" rx="8" fill="#FFFFFF" stroke="#D6E6EE"/><path d="M790 596 v18" stroke="#0878AC" stroke-width="3" stroke-linecap="round"/><text x="802" y="611" font-size="17" font-weight="600" fill="#173E58">W&amp;B · 학습 노트북</text><text x="790" y="646" font-size="16" fill="#53616C">서빙 아티팩트 버전 관리</text><text x="790" y="672" font-size="16" fill="#53616C">Snorkel · BiERU 별도 실험</text></g></svg>