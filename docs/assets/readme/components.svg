<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="764" viewBox="0 0 1120 764" role="img" aria-labelledby="title desc" font-family="Segoe UI, Malgun Gothic, Arial, sans-serif"><title id="title">기술 구성과 담당 기능</title><desc id="desc">앱과 기기: Flutter · Dart, 가입 · 매칭 · 통화 · 채팅, 분석 결과 · 장소 · 설정; WebRTC · Socket.IO, 영상·음성 / 연결 신호, 실시간 메시지; ML Kit · flutter_sound, 얼굴 감지와 마스크, 분석용 녹음; Geolocator · 이미지 도구, 위치 · 프로필 사진, 권한 · 로컬 저장. API와 데이터: Node.js · Express, 인증 · 관계 단계 · 외부 API, REST 요청 창구; bcryptjs · JWT, 비밀번호 해시, 로그인 토큰 검증; MySQL · mysql2, 회원 · 관계 · 채팅방, 메시지 저장; TourAPI · multer, 주변 데이트 장소 조회, 파일 업로드 수신. 대화와 모델: CLOVA Speech, 녹음 → 대화문, 통화 후 분석 입력; OpenAI API, 대화 피드백 생성, Node 서버를 통해 호출; Flask · Transformers · PyTorch, 관점별 KoBigBird 추론, 512토큰 · sigmoid 점수; W&amp;B · 학습 노트북, 서빙 아티팩트 버전 관리, Snorkel · BiERU 별도 실험</desc><rect width="1120" height="764" rx="12" fill="#FFFFFF"/><text x="28" y="40" font-size="24" font-weight="600" fill="#173E58">기술 구성과 담당 기능</text><path d="M28 60 H1092" stroke="#D6E6EE"/><rect x="28" y="84" width="332" height="654" rx="12" fill="#E9F5FC" fill-opacity="0.5" stroke="#D6E6EE"/><circle cx="50" cy="113" r="4" fill="#0878AC"/><text x="64" y="119" font-size="18" font-weight="600" fill="#173E58">앱과 기기</text><g><rect x="42" y="140" width="304" height="128" rx="8" fill="#FFFFFF" stroke="#D6E6EE"/><path d="M58 158 v18" stroke="#0878AC" stroke-width="3" stroke-linecap="round"/><text x="70" y="173" font-size="17" font-weight="600" fill="#173E58">Flutter · Dart</text><text x="58" y="208" font-size="16" fill="#53616C">가입 · 매칭 · 통화 · 채팅</text><text x="58" y="234" font-size="16" fill="#53616C">분석 결과 · 장소 · 설정</text></g><g><rect x="42" y="286" width="304" height="128" rx="8" fill="#FFFFFF" stroke="#D6E6EE"/><path d="M58 304 v18" stroke="#0878AC" stroke-width="3" stroke-linecap="round"/><text x="70" y="319" font-size="17" font-weight="600" fill="#173E58">WebRTC · Socket.IO</text><text x="58" y="354" font-size="16" fill="#53616C">영상·음성 / 연결 신호</text><text x="58